name: Clarus Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP 8.3)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-8.3-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: clarus
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Install development dependencies
        run: |
          git config --global --add safe.directory /var/www/glpi/plugins/clarus
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: Execute Clarus quality suite
        run: composer run qa

  integration:
    name: GLPI ${{ matrix.glpi-version }} / PHP ${{ matrix.php-version }} / ${{ matrix.db-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi-version: 10.0.x
            php-version: '8.2'
            db-image: mysql:8.4
          - glpi-version: 10.0.x
            php-version: '8.3'
            db-image: mysql:8.4
    uses: glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@e64f6feaa4e8656df3ac985a35a50e6f3f4a33eb # v1
    with:
      plugin-key: clarus
      glpi-version: ${{ matrix.glpi-version }}
      php-version: ${{ matrix.php-version }}
      db-image: ${{ matrix.db-image }}

  integration-exact:
    name: GLPI 10.0.20 / PHP 8.1 / mysql:5.7
    needs: release-artifact
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-8.1-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: >-
          --shm-size=1g
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: clarus
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Download the official GLPI 10.0.20 package
        run: |
          glpi_dir=/tmp/glpi-10.0.20
          curl --fail --location --silent --show-error --output /tmp/glpi-10.0.20.tgz https://github.com/glpi-project/glpi/releases/download/10.0.20/glpi-10.0.20.tgz
          mkdir -p /tmp/glpi-release
          tar -xzf /tmp/glpi-10.0.20.tgz -C /tmp/glpi-release
          mv /tmp/glpi-release/glpi "$glpi_dir"
          grep -Fx "define('GLPI_VERSION', '10.0.20');" "$glpi_dir/inc/define.php"
          test -f "$glpi_dir/vendor/autoload.php"
      - name: Download and verify production plugin archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clarus-release-package
          path: release-artifact
      - name: Install production plugin archive in GLPI 10.0.20
        run: |
          package_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2' -print -quit)"
          checksum_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2.sha256' -print -quit)"
          test -n "$package_path"
          test -n "$checksum_path"
          (cd "$(dirname "$package_path")" && sha256sum --check "$(basename "$checksum_path")")
          mkdir -p /tmp/clarus-plugin
          tar -xjf "$package_path" -C /tmp/clarus-plugin
          test -d /tmp/clarus-plugin/clarus
          mv /tmp/clarus-plugin/clarus /tmp/glpi-10.0.20/plugins/clarus
      - name: Install plugin development dependencies on PHP 8.1
        run: |
          git config --global --add safe.directory /var/www/glpi/plugins/clarus
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: Install and activate against GLPI 10.0.20
        working-directory: /tmp/glpi-10.0.20
        run: |
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password='' --strict-configuration
          php bin/console config:set url_base 'http://localhost'
          php bin/console config:set url_base_api 'http://localhost/apirest.php'
          bin/console plugin:install --ansi --no-interaction --username=glpi clarus
          bin/console plugin:activate --ansi --no-interaction clarus
      - name: Report GLPI 10.0.20 integration runtime
        working-directory: /tmp/glpi-10.0.20
        run: |
          php --version
          php bin/console --version
          test -f /tmp/glpi-10.0.20/inc/includes.php
          php -r '
            require "inc/includes.php";
            $plugin = new Plugin();
            if (!$plugin->getFromDBByCrit(["directory" => "clarus"]) || (int) $plugin->fields["state"] !== Plugin::ACTIVATED) {
              fwrite(STDERR, "The clarus plugin is not active.\n");
              exit(1);
            }
            printf("The clarus plugin is active (state: %d).\n", $plugin->fields["state"]);
          '
      - name: Run PHPUnit after activation on PHP 8.1
        run: php vendor/bin/phpunit --colors=always
      - name: Run RuleTicket characterization on GLPI 10.0.20
        run: >-
          GLPI_ROOT=/tmp/glpi-10.0.20 php vendor/bin/phpunit
          --configuration phpunit.glpi.xml
          --group glpi-integration
          --fail-on-skipped
          --colors=always
      - name: Deactivate, uninstall and verify residues
        working-directory: /tmp/glpi-10.0.20
        run: |
          bin/console plugin:deactivate --ansi --no-interaction clarus
          bin/console plugin:uninstall --ansi --no-interaction clarus
          cat > /tmp/check-uninstall.php <<'PHP'
          <?php
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $db = new mysqli('db', 'root', '', 'glpi');
          $checks = [
              "SHOW TABLES LIKE 'glpi_plugin_clarus_%'" => 'plugin tables',
              "SELECT COUNT(*) FROM glpi_configs WHERE context = 'plugin:clarus'" => 'configuration rows',
              "SELECT COUNT(*) FROM glpi_crontasks WHERE itemtype LIKE 'PluginClarus%' OR itemtype LIKE 'GlpiPlugin\\\\Clarus\\\\%'" => 'cron rows',
              "SELECT COUNT(*) FROM glpi_profilerights WHERE name LIKE 'plugin_clarus%'" => 'profile rights',
              "SELECT COUNT(*) FROM glpi_displaypreferences WHERE itemtype LIKE 'PluginClarus%'" => 'display preferences',
          ];
          foreach ($checks as $sql => $label) {
              $result = $db->query($sql);
              $count = str_starts_with($sql, 'SHOW') ? $result->num_rows : (int) $result->fetch_row()[0];
              if ($count !== 0) {
                  fwrite(STDERR, "Residual {$label}: {$count}\n");
                  exit(1);
              }
          }
          PHP
          php /tmp/check-uninstall.php

  rule-ticket-characterization-current:
    name: RuleTicket / GLPI 10.0.x / PHP 8.3 / mysql:8.4
    needs: release-artifact
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-8.3-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: >-
          --shm-size=1g
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: clarus-tests
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Install plugin development dependencies on PHP 8.3
        run: |
          git config --global --add safe.directory /var/www/glpi/plugins/clarus-tests
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: Download and verify production plugin archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clarus-release-package
          path: release-artifact
      - name: Install production plugin archive in current GLPI 10.0.x
        working-directory: /var/www/glpi
        run: |
          package_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2' -print -quit)"
          checksum_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2.sha256' -print -quit)"
          test -n "$package_path"
          test -n "$checksum_path"
          (cd "$(dirname "$package_path")" && sha256sum --check "$(basename "$checksum_path")")
          mkdir -p /tmp/clarus-plugin
          tar -xjf "$package_path" -C /tmp/clarus-plugin
          test -d /tmp/clarus-plugin/clarus
          mv /tmp/clarus-plugin/clarus plugins/clarus
      - name: Install and activate against current GLPI 10.0.x
        working-directory: /var/www/glpi
        run: |
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password='' --strict-configuration
          php bin/console config:set url_base 'http://localhost'
          php bin/console config:set url_base_api 'http://localhost/apirest.php'
          bin/console plugin:install --ansi --no-interaction --username=glpi clarus
          bin/console plugin:activate --ansi --no-interaction clarus
      - name: Report current GLPI 10.0.x integration runtime
        working-directory: /var/www/glpi
        run: |
          php --version
          php bin/console --version
          test -f /var/www/glpi/inc/includes.php
          php -r '
            require "inc/includes.php";
            $plugin = new Plugin();
            if (!$plugin->getFromDBByCrit(["directory" => "clarus"]) || (int) $plugin->fields["state"] !== Plugin::ACTIVATED) {
              fwrite(STDERR, "The clarus plugin is not active.\n");
              exit(1);
            }
            printf("The clarus plugin is active (state: %d).\n", $plugin->fields["state"]);
          '
      - name: Run RuleTicket characterization on current GLPI 10.0.x
        run: >-
          GLPI_ROOT=/var/www/glpi php vendor/bin/phpunit
          --configuration phpunit.glpi.xml
          --group glpi-integration
          --fail-on-skipped
          --colors=always

  unsupported-php:
    name: PHP ${{ matrix.php-version }} incompatibility is native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.4'
          - php-version: '8.4'
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php-version }}-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus
    steps:
      - name: Checkout plugin without dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: clarus
      - name: Confirm GLPI rejects unsupported PHP during plugin install
        working-directory: /var/www/glpi
        run: |
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password='' --strict-configuration
          set +e
          output="$(bin/console plugin:install --ansi --no-interaction --username=glpi clarus 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'GLPI accepted an unsupported PHP version.' >&2
            exit 1
          fi
          printf '%s' "$output" | grep -F 'requires PHP >= 8.1.0 and < 8.4.0.'

  release-artifact:
    name: Release artifact and extracted lifecycle
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache@sha256:6213dca8d5fa0c1b347a44679c43746edd6fda62d7ea1b7de52556cc5aeb585b
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: clarus
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Install release tooling
        run: |
          git config --global --add safe.directory /var/www/glpi/plugins/clarus
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: Build release archive with GLPI tooling
        working-directory: /var/www/glpi
        run: |
          mkdir -p plugins/clarus/dist
          php bin/console tools:plugin:release --plugin=clarus --dest=plugins/clarus/dist/clarus.tar.bz2 --no-interaction --force --verbose
          package_path="$(find plugins/clarus/dist -type f -name '*.tar.bz2' -print -quit)"
          test -n "$package_path"
          (cd "$(dirname "$package_path")" && sha256sum "$(basename "$package_path")" > "$(basename "$package_path").sha256")
      - name: Audit release archive contents
        working-directory: /var/www/glpi
        run: |
          PACKAGE_PATH="$(find plugins/clarus/dist -type f -name '*.tar.bz2' -print -quit)"
          tar -tjf "$PACKAGE_PATH" | tee /tmp/clarus-archive.txt
          if grep -Ev '^clarus(/|$)' /tmp/clarus-archive.txt; then
            echo 'The archive must contain only the clarus directory.' >&2
            exit 1
          fi
          for required in clarus/setup.php clarus/hook.php clarus/plugin.xml; do
            grep -Fx "$required" /tmp/clarus-archive.txt
          done
          for forbidden in .github/ tests/ AGENTS.md .php-cs-fixer.php .phpcs.xml phpstan.neon phpunit.xml phpunit.xml.dist stubs/ composer.lock var/; do
            if grep -Fq "clarus/$forbidden" /tmp/clarus-archive.txt; then
              echo "Unexpected development content: clarus/$forbidden" >&2
              exit 1
            fi
          done
          for development_dependency in vendor/friendsofphp/ vendor/glpi-project/coding-standard/ vendor/phpstan/ vendor/phpunit/ vendor/squizlabs/; do
            if grep -Fq "clarus/$development_dependency" /tmp/clarus-archive.txt; then
              echo "Unexpected development dependency: clarus/$development_dependency" >&2
              exit 1
            fi
          done
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clarus-release-package
          path: |
            /var/www/glpi/plugins/clarus/dist/*.tar.bz2
            /var/www/glpi/plugins/clarus/dist/*.tar.bz2.sha256
          if-no-files-found: error

  artifact-lifecycle:
    needs: release-artifact
    name: Extracted release artifact lifecycle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-8.3-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi
    steps:
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clarus-release-package
          path: release-artifact
      - name: Install, activate, deactivate and uninstall extracted artifact
        run: |
          package_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2' -print -quit)"
          test -n "$package_path"
          mkdir -p /tmp/clarus-release
          tar -xjf "$package_path" -C /tmp/clarus-release
          test -d /tmp/clarus-release/clarus
          mv /tmp/clarus-release/clarus plugins/clarus
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password='' --strict-configuration
          php bin/console config:set url_base 'http://localhost'
          php bin/console config:set url_base_api 'http://localhost/apirest.php'
          bin/console plugin:install --ansi --no-interaction --username=glpi clarus
          bin/console plugin:activate --ansi --no-interaction clarus
          bin/console plugin:deactivate --ansi --no-interaction clarus
          bin/console plugin:uninstall --ansi --no-interaction clarus
          cat > /tmp/check-uninstall.php <<'PHP'
          <?php
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $db = new mysqli('db', 'root', '', 'glpi');
          $checks = [
              "SHOW TABLES LIKE 'glpi_plugin_clarus_%'" => 'plugin tables',
              "SELECT COUNT(*) FROM glpi_configs WHERE context = 'plugin:clarus'" => 'configuration rows',
              "SELECT COUNT(*) FROM glpi_crontasks WHERE itemtype LIKE 'PluginClarus%' OR itemtype LIKE 'GlpiPlugin\\\\Clarus\\\\%'" => 'cron rows',
              "SELECT COUNT(*) FROM glpi_profilerights WHERE name LIKE 'plugin_clarus%'" => 'profile rights',
              "SELECT COUNT(*) FROM glpi_displaypreferences WHERE itemtype LIKE 'PluginClarus%'" => 'display preferences',
          ];
          foreach ($checks as $sql => $label) {
              $result = $db->query($sql);
              $count = str_starts_with($sql, 'SHOW') ? $result->num_rows : (int) $result->fetch_row()[0];
              if ($count !== 0) {
                  fwrite(STDERR, "Residual {$label}: {$count}\n");
                  exit(1);
              }
          }
          PHP
          php /tmp/check-uninstall.php

  permissions-upgrade:
    name: Permissions upgrade / GLPI ${{ matrix.glpi-version }} / PHP ${{ matrix.php-version }}
    needs: release-artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi-version: 10.0.20
            php-version: '8.1'
            db-version: '5.7'
          - glpi-version: 10.0.x
            php-version: '8.3'
            db-version: '8.4'
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php-version }}-glpi-10.0.x
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-mysql:${{ matrix.db-version }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: >-
          --shm-size=1g
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/clarus-tests
    steps:
      - name: Checkout test source and Phase 4 history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: clarus-tests
      - name: Grant the runtime user write access
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: Install test dependencies
        run: |
          git config --global --add safe.directory /var/www/glpi/plugins/clarus-tests
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: Prepare the requested GLPI runtime
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            curl --fail --location --silent --show-error --output /tmp/glpi-10.0.20.tgz https://github.com/glpi-project/glpi/releases/download/10.0.20/glpi-10.0.20.tgz
            mkdir -p /tmp/glpi-release
            tar -xzf /tmp/glpi-10.0.20.tgz -C /tmp/glpi-release
            mv /tmp/glpi-release/glpi /tmp/glpi-10.0.20
            grep -Fx "define('GLPI_VERSION', '10.0.20');" /tmp/glpi-10.0.20/inc/define.php
          else
            test -f /var/www/glpi/inc/includes.php
          fi
      - name: Build and install the pre-Phase 5 production artifact
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            glpi_dir=/tmp/glpi-10.0.20
          else
            glpi_dir=/var/www/glpi
          fi
          phase4_ref=7edb7115ef84a645525619eeb704e010fa98b0ec
          mkdir -p /tmp/clarus-phase4-source/clarus
          git -C /var/www/glpi/plugins/clarus-tests archive "$phase4_ref" | tar -x -C /tmp/clarus-phase4-source/clarus
          mv /tmp/clarus-phase4-source/clarus "$glpi_dir/plugins/clarus"
          (
            cd "$glpi_dir/plugins/clarus"
            composer install --ansi --no-interaction --no-progress --prefer-dist
          )
          php "$glpi_dir/bin/console" tools:plugin:release --plugin=clarus --dest=/tmp/clarus-phase4.tar.bz2 --no-interaction --force
          mkdir -p /tmp/clarus-phase4-artifact
          tar -xjf /tmp/clarus-phase4.tar.bz2 -C /tmp/clarus-phase4-artifact
          test -d /tmp/clarus-phase4-artifact/clarus
          mv "$glpi_dir/plugins/clarus" /tmp/clarus-phase4-build-source
          mv /tmp/clarus-phase4-artifact/clarus "$glpi_dir/plugins/clarus"
      - name: Install and activate the pre-Phase 5 artifact
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            glpi_dir=/tmp/glpi-10.0.20
          else
            glpi_dir=/var/www/glpi
          fi
          cd "$glpi_dir"
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password='' --strict-configuration
          php bin/console config:set url_base 'http://localhost'
          php bin/console config:set url_base_api 'http://localhost/apirest.php'
          bin/console plugin:install --ansi --no-interaction --username=glpi clarus
          bin/console plugin:activate --ansi --no-interaction clarus
      - name: Download and verify the Phase 5 production artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clarus-release-package
          path: release-artifact
      - name: Upgrade the installed artifact to Phase 5
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            glpi_dir=/tmp/glpi-10.0.20
          else
            glpi_dir=/var/www/glpi
          fi
          package_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2' -print -quit)"
          checksum_path="$(find "$GITHUB_WORKSPACE/release-artifact" -type f -name '*.tar.bz2.sha256' -print -quit)"
          test -n "$package_path"
          test -n "$checksum_path"
          (cd "$(dirname "$package_path")" && sha256sum --check "$(basename "$checksum_path")")
          mkdir -p /tmp/clarus-phase5-artifact
          tar -xjf "$package_path" -C /tmp/clarus-phase5-artifact
          test -d /tmp/clarus-phase5-artifact/clarus
          mv "$glpi_dir/plugins/clarus" /tmp/clarus-phase4-installed
          mv /tmp/clarus-phase5-artifact/clarus "$glpi_dir/plugins/clarus"
          cd "$glpi_dir"
          bin/console plugin:install --ansi --no-interaction --username=glpi clarus
          bin/console plugin:activate --ansi --no-interaction clarus
      - name: Assert default denial after artifact upgrade
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            glpi_dir=/tmp/glpi-10.0.20
          else
            glpi_dir=/var/www/glpi
          fi
          cd "$glpi_dir"
          php -r '
            require "inc/includes.php";
            global $DB;
            $right = "plugin_clarus_inspect";
            $rows = $DB->request(["COUNT" => "count", "FROM" => "glpi_profilerights", "WHERE" => ["name" => $right]]);
            $count = 0;
            foreach ($rows as $row) {
                $count = (int) $row["count"];
            }
            $granted = 0;
            foreach ($DB->request(["COUNT" => "count", "FROM" => "glpi_profilerights", "WHERE" => ["name" => $right, ["NOT" => ["rights" => 0]]]]) as $row) {
                $granted = (int) $row["count"];
            }
            if ($count === 0 || $granted !== 0) {
                fwrite(STDERR, "The upgraded right was not registered with default denial.\n");
                exit(1);
            }
            foreach ($DB->request(["COUNT" => "count", "FROM" => "glpi_profilerights", "INNER JOIN" => ["glpi_profiles" => ["FKEY" => ["glpi_profilerights" => "profiles_id", "glpi_profiles" => "id"]]], "WHERE" => ["name" => $right, "glpi_profiles.name" => "Super-Admin", "rights" => 0]]) as $row) {
                if ((int) $row["count"] !== 1) {
                    fwrite(STDERR, "Super-Admin was not explicitly denied after upgrade.\n");
                    exit(1);
                }
            }
          '
      - name: Run real permission integration tests
        run: >-
          GLPI_ROOT=${{ matrix.glpi-version == '10.0.20' && '/tmp/glpi-10.0.20' || '/var/www/glpi' }} php vendor/bin/phpunit
          --configuration phpunit.glpi.xml
          --group glpi-integration
          --fail-on-skipped
          --colors=always
      - name: Deactivate, uninstall and verify the exact right is removed
        run: |
          if [ '${{ matrix.glpi-version }}' = '10.0.20' ]; then
            glpi_dir=/tmp/glpi-10.0.20
          else
            glpi_dir=/var/www/glpi
          fi
          cd "$glpi_dir"
          bin/console plugin:deactivate --ansi --no-interaction clarus
          bin/console plugin:uninstall --ansi --no-interaction clarus
          php -r '
            require "inc/includes.php";
            global $DB;
            foreach ($DB->request(["COUNT" => "count", "FROM" => "glpi_profilerights", "WHERE" => ["name" => "plugin_clarus_inspect"]]) as $row) {
                if ((int) $row["count"] !== 0) {
                    fwrite(STDERR, "The Clarus inspection right remains after uninstall.\n");
                    exit(1);
                }
            }
          '
  final-gate:
    name: Clarus Quality Gate
    if: ${{ always() }}
    needs:
      - quality
      - integration
      - integration-exact
      - rule-ticket-characterization-current
      - unsupported-php
      - release-artifact
      - artifact-lifecycle
      - permissions-upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq .
          for result in $(printf '%s' "$NEEDS_JSON" | jq -r '.[].result'); do
            case "$result" in
              success) ;;
              failure|cancelled|skipped)
                echo "Unexpected prerequisite result: $result" >&2
                exit 1
                ;;
              *)
                echo "Unknown prerequisite result: $result" >&2
                exit 1
                ;;
            esac
          done
